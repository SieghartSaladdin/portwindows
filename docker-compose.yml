name: portwindows

services:
  portwindows:
    image: rfieq/portwindows:latest
    container_name: portwindows
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://ai.rfieq.me/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-Combo_Secondary}
      - MCP_API_KEY=${MCP_API_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-Doraemon}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
    env_file:
      - .env.local
    volumes:
      - ./prisma:/app/prisma
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
