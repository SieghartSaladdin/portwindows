name: portwindows

services:
  # 🐘 PostgreSQL 16 Database Container
  postgres:
    image: postgres:16-alpine
    container_name: portwindows-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-portfolio_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portfolio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 💻 Next.js Aura OS Web Application & API Service
  portwindows:
    image: rfieq/portwindows:latest
    container_name: portwindows
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://ai.rfieq.me/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-Combo_Secondary}
      - MCP_API_KEY=${MCP_API_KEY:-mcp-sk-secretkey12345}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Doraemon123.}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/portfolio_db?schema=public}
    command: >
      sh -c "
        echo '🚀 Synchronizing PostgreSQL Schema with Prisma...' &&
        npx prisma db push --accept-data-loss &&
        echo '⚡ Starting Next.js App Server...' &&
        node server.js
      "
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
